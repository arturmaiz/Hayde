<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07071a"/>
      <stop offset="100%" stop-color="#130d2e"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b0f0f0"/>
      <stop offset="100%" stop-color="#63dcdc"/>
    </linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9898"/>
      <stop offset="100%" stop-color="#ff7070"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <!-- Sky background -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Stars -->
    <circle cx="90"  cy="80"  r="3.5" fill="#fff" opacity="0.45"/>
    <circle cx="240" cy="55"  r="2.5" fill="#fff" opacity="0.35"/>
    <circle cx="370" cy="110" r="3"   fill="#fff" opacity="0.42"/>
    <circle cx="455" cy="65"  r="2"   fill="#fff" opacity="0.3"/>
    <circle cx="48"  cy="175" r="2.5" fill="#fff" opacity="0.38"/>
    <circle cx="310" cy="175" r="2"   fill="#fff" opacity="0.3"/>
    <circle cx="175" cy="140" r="2"   fill="#fff" opacity="0.28"/>

    <!-- Ground strip -->
    <rect x="0" y="382" width="512" height="130" fill="#0c1030"/>
    <!-- Neon edge line -->
    <rect x="0" y="379" width="512" height="5" fill="#63dcdc"/>

    <!-- Player character -->
    <rect x="96"  y="282" width="80" height="100" rx="15" fill="url(#pg)"/>
    <!-- Shine -->
    <rect x="103" y="289" width="34" height="28"  rx="8"  fill="rgba(255,255,255,0.22)"/>
    <!-- Eye -->
    <circle cx="152" cy="314" r="9" fill="rgba(255,255,255,0.55)"/>

    <!-- Obstacle (tall pillar) -->
    <rect x="342" y="234" width="56" height="148" rx="11" fill="url(#og)"/>
    <!-- Obstacle shine -->
    <rect x="347" y="239" width="46" height="15"  rx="7"  fill="rgba(255,255,255,0.16)"/>

    <!-- Ground dash marks -->
    <rect x="200" y="410" width="40" height="2" rx="1" fill="#63dcdc" opacity="0.2"/>
    <rect x="260" y="425" width="28" height="2" rx="1" fill="#63dcdc" opacity="0.15"/>
  </g>
</svg>
