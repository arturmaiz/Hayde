name: Build Android APK

on:
  push:
    branches: [ claude/mobile-game-app-UnYC2, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Copy web assets and sync
        run: npm run cap-sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hayde-game
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/claude/mobile-game-app-UnYC2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta
          name: "Hayde v1.0.0 Beta"
          body: |
            ## Hayde - Israeli Supermarket Runner

            Download the APK file below and install it on your Android phone.

            ### How to install:
            1. Download `hayde-game.apk` below
            2. Open it on your Android phone
            3. Tap "Install" (allow "Install from unknown sources" if asked)
            4. Play!
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
