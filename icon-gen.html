<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><style>*{margin:0;padding:0;background:#000}</style></head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const TAU = Math.PI * 2;

// Background
const bg = ctx.createRadialGradient(256, 220, 30, 256, 256, 340);
bg.addColorStop(0,   '#0d0d2a');
bg.addColorStop(0.5, '#07071a');
bg.addColorStop(1,   '#030308');
ctx.fillStyle = bg;
// Rounded square clip
const r = 112;
ctx.beginPath();
ctx.moveTo(r, 0); ctx.lineTo(512-r, 0);
ctx.quadraticCurveTo(512, 0, 512, r);
ctx.lineTo(512, 512-r);
ctx.quadraticCurveTo(512, 512, 512-r, 512);
ctx.lineTo(r, 512);
ctx.quadraticCurveTo(0, 512, 0, 512-r);
ctx.lineTo(0, r);
ctx.quadraticCurveTo(0, 0, r, 0);
ctx.closePath();
ctx.fill();

ctx.save();
ctx.beginPath();
ctx.moveTo(r, 0); ctx.lineTo(512-r, 0);
ctx.quadraticCurveTo(512, 0, 512, r);
ctx.lineTo(512, 512-r);
ctx.quadraticCurveTo(512, 512, 512-r, 512);
ctx.lineTo(r, 512);
ctx.quadraticCurveTo(0, 512, 0, 512-r);
ctx.lineTo(0, r);
ctx.quadraticCurveTo(0, 0, r, 0);
ctx.closePath();
ctx.clip();

// Stars
const stars = [
  [80,60,2.5,0.5],[230,40,2,0.4],[390,80,2.8,0.5],[460,50,1.8,0.35],
  [50,160,2.2,0.4],[430,140,2,0.35],[160,110,1.8,0.3],[330,55,2.2,0.4],
  [490,200,1.5,0.3],[20,320,1.8,0.25],[480,380,2,0.3],[100,430,1.5,0.25],
];
stars.forEach(([x,y,rad,a]) => {
  ctx.beginPath(); ctx.arc(x,y,rad,0,TAU);
  ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
});

// Neon grid perspective lines from vanishing point
ctx.save();
ctx.globalAlpha = 0.22;
const vx = 256, vy = 170;
const gridLines = [
  [0, 512], [80, 512], [160, 512], [240, 512], [320, 512], [400, 512], [512, 512],
  [0, 400], [512, 400],
];
ctx.strokeStyle = '#4a5aff';
ctx.lineWidth = 1;
// Horizontal grid lines converging to vp
for (let i = 0; i <= 6; i++) {
  const t = i / 6;
  const leftX  = lerp(vx - 40, 0,   t);
  const rightX = lerp(vx + 40, 512, t);
  const y = lerp(vy, 512, t * t);
  if (y < 300) continue;
  ctx.globalAlpha = t * 0.28;
  ctx.beginPath();
  ctx.moveTo(leftX, y); ctx.lineTo(rightX, y);
  ctx.stroke();
}
// Vertical lines to VP
[-140, -60, 0, 60, 140].forEach(offset => {
  ctx.globalAlpha = 0.18;
  ctx.beginPath();
  ctx.moveTo(vx + offset * 0.08, vy);
  ctx.lineTo(vx + offset, 512);
  ctx.stroke();
});
ctx.restore();

function lerp(a,b,t){ return a+(b-a)*t; }

// Glow behind cart
const glow = ctx.createRadialGradient(256, 290, 0, 256, 290, 180);
glow.addColorStop(0, 'rgba(0,113,227,0.30)');
glow.addColorStop(0.5, 'rgba(0,113,227,0.10)');
glow.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = glow;
ctx.fillRect(0, 0, 512, 512);

// ── Cart ─────────────────────────────────────────────
const cx = 256, cy = 290;
const cw = 200, ch = 160;
const hw = cw/2, hh = ch/2;

ctx.save();
ctx.translate(cx, cy);

// Basket body fill
ctx.beginPath();
ctx.roundRect(-hw, -hh, cw, ch*0.70, [12,12,6,6]);
const bodyGrad = ctx.createLinearGradient(-hw,-hh,hw,hh*0.7);
bodyGrad.addColorStop(0, 'rgba(180,195,230,0.22)');
bodyGrad.addColorStop(1, 'rgba(120,140,180,0.10)');
ctx.fillStyle = bodyGrad;
ctx.fill();

// Wire grid
ctx.save();
ctx.beginPath();
ctx.roundRect(-hw, -hh, cw, ch*0.70, [12,12,6,6]);
ctx.clip();
ctx.strokeStyle = 'rgba(180,200,240,0.65)';
ctx.lineWidth = 2.5;
for (let i = 1; i <= 3; i++) {
  const wy = -hh + (ch*0.70 * i/4);
  ctx.beginPath(); ctx.moveTo(-hw,wy); ctx.lineTo(hw,wy); ctx.stroke();
}
for (let i = 1; i <= 4; i++) {
  const vx2 = -hw + (cw * i/5);
  ctx.beginPath(); ctx.moveTo(vx2,-hh); ctx.lineTo(vx2,-hh+ch*0.70); ctx.stroke();
}
ctx.restore();

// Basket border
ctx.beginPath();
ctx.roundRect(-hw, -hh, cw, ch*0.70, [12,12,6,6]);
ctx.strokeStyle = 'rgba(200,220,255,0.88)';
ctx.lineWidth = 3.5;
ctx.stroke();

// Handle posts
ctx.strokeStyle = 'rgba(185,200,230,0.82)';
ctx.lineWidth = 5;
[-hw*0.52, hw*0.52].forEach(px => {
  ctx.beginPath();
  ctx.moveTo(px, -hh);
  ctx.lineTo(px, -hh - ch*0.10);
  ctx.stroke();
});

// Handle bar
const hbGrad = ctx.createLinearGradient(-hw*0.58, -hh-ch*0.18, -hw*0.58, -hh-ch*0.06);
hbGrad.addColorStop(0, '#c8d2ee');
hbGrad.addColorStop(0.4, '#e8ecff');
hbGrad.addColorStop(1, '#8890b8');
ctx.beginPath();
ctx.roundRect(-hw*0.60, -hh - ch*0.18, cw*0.60, ch*0.10, 8);
ctx.fillStyle = hbGrad;
ctx.fill();
ctx.strokeStyle = 'rgba(220,235,255,0.55)';
ctx.lineWidth = 1.5;
ctx.stroke();

// Chassis
ctx.beginPath();
ctx.roundRect(-hw*0.80, hh*0.38, cw*0.80, ch*0.16, [0,0,6,6]);
const chasGrad = ctx.createLinearGradient(0, hh*0.38, 0, hh*0.56);
chasGrad.addColorStop(0, '#5a6088');
chasGrad.addColorStop(1, '#2a2e48');
ctx.fillStyle = chasGrad;
ctx.fill();

// Blue accent stripe
ctx.save();
ctx.globalAlpha = 0.6;
const acG = ctx.createLinearGradient(-hw, 0, hw, 0);
acG.addColorStop(0, 'rgba(0,113,227,0)');
acG.addColorStop(0.3, 'rgba(0,150,255,0.85)');
acG.addColorStop(0.7, 'rgba(0,150,255,0.85)');
acG.addColorStop(1, 'rgba(0,113,227,0)');
ctx.fillStyle = acG;
ctx.fillRect(-hw, hh*0.30, cw, 4);
ctx.restore();

// Wheels
const wheelR = 24;
const wheelY = hh*0.60;
[-hw*0.52, hw*0.52].forEach(wx => {
  // Shadow
  ctx.beginPath(); ctx.ellipse(wx, wheelY+wheelR*0.22, wheelR*0.8, wheelR*0.22, 0,0,TAU);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fill();
  // Tire
  const tireG = ctx.createRadialGradient(wx-8,wheelY-8,0,wx,wheelY,wheelR);
  tireG.addColorStop(0,'#3a3e5a'); tireG.addColorStop(1,'#0e1020');
  ctx.beginPath(); ctx.arc(wx,wheelY,wheelR,0,TAU);
  ctx.fillStyle=tireG; ctx.fill();
  ctx.strokeStyle='rgba(90,105,150,0.65)'; ctx.lineWidth=2.5; ctx.stroke();
  // Hub
  const hubG = ctx.createRadialGradient(wx-4,wheelY-4,0,wx,wheelY,wheelR*0.40);
  hubG.addColorStop(0,'#c0c8e8'); hubG.addColorStop(1,'#6070a8');
  ctx.beginPath(); ctx.arc(wx,wheelY,wheelR*0.40,0,TAU);
  ctx.fillStyle=hubG; ctx.fill();
  // Spokes
  ctx.strokeStyle='rgba(70,80,120,0.7)'; ctx.lineWidth=2;
  for(let s=0;s<4;s++){
    const a=(s/4)*TAU;
    ctx.beginPath();
    ctx.moveTo(wx+Math.cos(a)*wheelR*0.38,wheelY+Math.sin(a)*wheelR*0.38);
    ctx.lineTo(wx+Math.cos(a)*wheelR*0.80,wheelY+Math.sin(a)*wheelR*0.80);
    ctx.stroke();
  }
});

// Sheen
ctx.save();
ctx.beginPath();
ctx.roundRect(-hw, -hh, cw, ch*0.70, [12,12,6,6]);
ctx.clip();
const sheen = ctx.createLinearGradient(-hw,-hh,hw*0.3,-hh+ch*0.30);
sheen.addColorStop(0,'rgba(255,255,255,0.18)');
sheen.addColorStop(1,'rgba(255,255,255,0)');
ctx.fillStyle=sheen;
ctx.fillRect(-hw,-hh,cw,ch*0.70);
ctx.restore();

ctx.restore(); // end cart

// ── Food emojis around cart ──────────────────────────
ctx.font = '36px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
const floaters = [
  ['🍎', 100, 200], ['🍌', 400, 180], ['🥛', 90, 340],
  ['🍕', 420, 340], ['🧀', 148, 420], ['🍊', 370, 420],
];
floaters.forEach(([e, x, y]) => {
  ctx.globalAlpha = 0.72;
  ctx.fillText(e, x, y);
});
ctx.globalAlpha = 1;

// ── "HAYDE" text ──────────────────────────────────────
ctx.save();
ctx.font = 'bold 64px -apple-system, Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.letterSpacing = '8px';

// Text glow
ctx.shadowColor = 'rgba(0,150,255,0.9)';
ctx.shadowBlur = 24;
const textGrad = ctx.createLinearGradient(156, 460, 356, 500);
textGrad.addColorStop(0, '#a8c8ff');
textGrad.addColorStop(0.5, '#ffffff');
textGrad.addColorStop(1, '#80aaff');
ctx.fillStyle = textGrad;
ctx.fillText('HAYDE', 256, 472);
ctx.restore();

// Bottom strip glow
ctx.save();
ctx.globalAlpha = 0.35;
const strip = ctx.createLinearGradient(0, 490, 0, 512);
strip.addColorStop(0, 'rgba(0,113,227,0.5)');
strip.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = strip;
ctx.fillRect(0, 490, 512, 22);
ctx.restore();

ctx.restore(); // end clip
</script>
</body>
</html>
