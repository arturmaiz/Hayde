<!DOCTYPE html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFF3E0;
      touch-action: none;
